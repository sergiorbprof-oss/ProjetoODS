<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Simples e Moderna</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <header class="bg-white shadow-sm border-b border-slate-200">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-lg">
                    P
                </div>
                <span class="font-bold text-xl text-slate-900 tracking-tight">MeuSite</span>
            </div>
            <nav class="space-x-4 text-sm font-medium text-slate-600">
                <a href="#inicio" class="hover:text-indigo-600 transition-colors">Início</a>
                <a href="#contador" class="hover:text-indigo-600 transition-colors">Interativo</a>
            </nav>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-12 flex-grow w-full">
        <!-- Seção de Boas-Vindas -->
        <section id="inicio" class="text-center mb-12">
            <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight sm:text-5xl mb-4">
                Bem-vindo ao projeto ODS
            </h1>
            <p class="text-lg text-slate-600 max-w-2xl mx-auto">
                Este é um exemplo simples, moderno e limpo desenvolvido com HTML, CSS (Tailwind) e JavaScript interativo.
            </p>
        </section>

        
    </main>

    <footer class="bg-white border-t border-slate-200 py-6 mt-12">
        <div class="max-w-4xl mx-auto px-4 text-center text-sm text-slate-500">
            <p>© <span id="year"></span> MeuSite. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Lógica do Contador
            let count = 0;
            const counterElement = document.getElementById('counter-value');
            const incrementBtn = document.getElementById('btn-increment');
            const resetBtn = document.getElementById('btn-reset');

            incrementBtn.addEventListener('click', () => {
                count++;
                counterElement.textContent = count;
            });

            resetBtn.addEventListener('click', () => {
                count = 0;
                counterElement.textContent = count;
            });

            // Ano Dinâmico no Rodapé
            document.getElementById('year').textContent = new Date().getFullYear();
        });
    </script>
</body>
</html>
